  let b='';

    const v=p[s].filter(ok);
    if(s=='d')b='<span class="mu">Toca una carta boca abajo</span>';
    else if(sel.length)b=`<button onclick="go()">Jugar ${sel.length>1?sel.length+' cartas':'carta'}</button>`;
    else if(!v.length)b=s=='h'&&G.deck.length?`<span class="mu">No tienes carta válida</span><br><button onclick="blind(0)">Jugar del mazo (a ciegas)</button>`:`<span class="mu">No tienes carta válida</span><br><button onclick="take(0)">Llevarte el montón</button>`;
    else b='<span class="mu">Elige una carta. Las que no sirven (opacas) te hacen llevar el montón</span>';
    if(s=='h'&&G.deck.length&&v.length&&!G.resp)b+=`<br><button class="sec" onclick="blind(0)">Arriesgar: jugar del mazo</button>`;
    if(!G.resp&&(G.pile.length||G.jk)&&!b.includes('take(0)'))b+=`<br><button class="sec" onclick="take(0)">Llevarte el montón</button>`;
    if(G.resp&&G.resp.other!=null)b+=`<br><button class="sec" onclick="cede()">Ceder</button>`;
  }
  if(!me&&lz&&p[s].some(c=>c.r==tp().r))b=`<button class="zapb" onclick="zap()" ${sel.length?'':'disabled'}>⚡ Relámpago${sel.length?' ('+sel.length+')':''}</button><br><span class="mu">Elige las cartas ⚡ y luego presiona Relámpago</span>`;
  h+=`<div class="act">${b}</div>`;
  if(G.over)h+=`<div class="ov end"><div class="rain">${Array.from({length:18},(_,k)=>`<span style="left:${(k*37)%100}%;animation-delay:${(k%6)*.35}s;font-size:${18+(k%4)*8}px">💩</span>`).join('')}</div><div class="box"><div class="big">💩</div><div class="ttl">CARA DE CACA</div><div class="nm">${G.loser==0?'¡ERES TÚ!':P[G.loser].n}</div>${REC?`<div class="mu">Tu récord: ${REC.l} derrotas en ${REC.g} partidas</div>`:''}<button onclick="menu()">Jugar otra vez</button></div></div>`;
  if(G.jk&&!G.over)h+='<div class="jkL">'+JK+'</div><div class="jkR">'+JK+'</div>';document.body.classList.toggle('jk',!!G.jk&&!G.over);$('app').innerHTML=h;
}
/* ---- Red ---- */
let WS=null,ROOM=null,NAME='',REC=null,LAST=null,MQ=[],MBUSY=false,PRE=[],POST=[];
try{NAME=localStorage.getItem('cdc_name')||''}catch(e){}
const send=o=>{if(WS&&WS.readyState==1)WS.send(JSON.stringify(o))};
function go(){if(sel.length){send({t:'play',ids:sel});sel=[]}}
function zap(){if(sel.length){send({t:'zap',ids:sel});sel=[]}}
function blind(){send({t:'blind'})}
function take(){send({t:'take'})}
function down(i,k){send({t:'down',k})}
function cede(){send({t:'cede'})}
let RC=0,TOK='';
try{TOK=localStorage.getItem('cdc_tok')||''}catch(e){}
function clearSaved(){TOK='';try{localStorage.removeItem('cdc_tok');localStorage.removeItem('cdc_room')}catch(e){}}
function tryRe(){
  if(RC++>25){ROOM=null;clearSaved();const d=$('rc');if(d)d.remove();home();return}
  let d=$('rc');if(!d){d=document.createElement('div');d.id='rc';d.className='ov';document.body.appendChild(d)}
  d.innerHTML='<div>Reconectando…</div>';
  setTimeout(()=>{if(!WS&&ROOM)connect(()=>send({t:'rejoin',code:ROOM,token:TOK}))},1500);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ROOM&&!WS)tryRe()});
function connect(then){
  const u=(location.protocol=='https:'?'wss://':'ws://')+location.host;
  WS=new WebSocket(u);WS.onopen=then;WS.onmessage=e=>{MQ.push(JSON.parse(e.data));pump()};
  WS.onclose=()=>{WS=null;if(ROOM)tryRe();else home()};
}
const pinv=()=>($('pin')&&$('pin').value||'').trim();
const nmv=()=>{NAME=($('nm').value||'Jugador').trim().slice(0,12);try{localStorage.setItem('cdc_name',NAME)}catch(e){}return NAME};
function mkRoom(){const n=nmv();if(WS)WS.close();connect(()=>send({t:'create',name:n,pin:pinv()}))}
function joinRoom(){const n=nmv(),c=$('cd').value.trim().toUpperCase();if(WS)WS.close();connect(()=>send({t:'join',name:n,code:c,pin:pinv()}))}
function home(){
  document.body.classList.remove('jk');G=null;ROOM=null;
  $('app').innerHTML=`<div class="menu"><h1>💩 Cara de caca</h1><p>Online</p><input id="nm" maxlength="12" placeholder="Tu nombre" value="${NAME.replace(/[<>&"']/g,'')}"><br><input id="pin" type="password" maxlength="12" placeholder="PIN (opcional)" autocomplete="off"><p class="mu">Con PIN se guarda tu historial de derrotas.<br>Sin PIN juegas como invitado.</p><button onclick="mkRoom()">Crear sala</button><p>o únete con un código</p><input id="cd" maxlength="4" placeholder="CÓDIGO"><br><button class="sec" onclick="joinRoom()">Unirse</button><p class="mu" id="er"></p><button class="sec" onclick="send2({t:'board'})">🏆 Derrotas</button></div>`;
}
function send2(o){if(WS&&WS.readyState==1)return send(o);connect(()=>send(o))}
function board(list){
  $('app').innerHTML=`<div class="menu"><h1>Derrotas</h1><div style="max-width:380px;margin:0 auto">${list.length?list.map((u,i)=>`<div class="o" style="margin:6px 0"><b>${i+1}. ${u.n}</b><span>💩 ${u.l} de ${u.g} (${Math.round(u.l/u.g*100)}%)</span></div>`).join(''):'<p class="mu">Aún no hay partidas registradas.</p>'}</div><button onclick="home()">Volver</button></div>`;
}
function menu(){if(ROOM)send({t:'again'});else home()}
function lobby(m){
  document.body.classList.remove('jk');
  const ds=[['f','Fácil'],['m','Medio'],['d','Difícil']];
  $('app').innerHTML=`<div class="menu"><h1>Sala ${m.code}</h1>${m.rec?`<p class="mu">Tu récord: ${m.rec.l} derrotas en ${m.rec.g} partidas</p>`:''}<p class="mu">Comparte este código con tus amigos</p><div style="max-width:360px;margin:0 auto">${m.seats.map((s,i)=>`<div class="o" style="margin:6px 0"><b>${s.n}${i==m.you?' (tú)':''}${s.host?' ★':''}</b><span>${s.bot?'🤖 Bot':'👤 Jugador'}</span></div>`).join('')}</div>${m.host?`<p>Dificultad de los bots</p><div class="nb">${ds.map(([k,n])=>`<button class="df${m.diff==k?' on':''}" onclick="send({t:'diff',d:'${k}'})">${n}</button>`).join('')}</div><button class="sec" onclick="send({t:'addbot'})">+ Bot</button><button class="sec" onclick="send({t:'rmbot'})">− Bot</button><br><button onclick="send({t:'start'})">Empezar</button>`:'<p class="mu">Esperando al anfitrión…</p>'}</div>`;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function pump(){if(MBUSY)return;MBUSY=true;try{while(MQ.length)await onMsg(MQ.shift())}finally{MBUSY=false}}
function runAnim(a){
  return new Promise(res=>{
    let d=false;const fin=()=>{if(!d){d=true;BUSY=false;res()}};
    if(!LAST||!G||G.over){res();return}
    setTimeout(fin,1300);
    const i=(a.i-LAST.me+LAST.n)%LAST.n;
    try{
      if(a.k=='play'){ORG=a.h==null?null:a.h;anim(i,a.cs,()=>{G.pile.push(...a.cs);fin()})}
      else if(a.k=='take')animTake(i,fin);else fin();
    }catch(e){fin()}
  });
}
async function onMsg(m){
  if(m.t=='rec'){REC={g:m.g,l:m.l};if(G&&G.over)render();return}
  if(m.t=='board'){board(m.list);return}
  if(m.t=='fx'&&m.a){if(m.a.k=='draw')POST.push(m.a);else PRE.push(m.a);return}
  if(m.t=='lobby'||m.t=='state'){RC=0;const d=$('rc');if(d)d.remove()}
  if(m.t=='lobby'&&m.token){TOK=m.token;try{localStorage.setItem('cdc_tok',TOK);localStorage.setItem('cdc_room',m.code)}catch(e){}}
  if(m.t=='err'&&m.m=='La sala ya no existe'){ROOM=null;clearSaved();const d=$('rc');if(d)d.remove();home();return}
  if(m.t=='err'){const e=$('er');if(e)e.textContent=m.m;else alert(m.m);return}
  if(m.t=='lobby'){ROOM=m.code;G=null;lobby(m);return}
  if(m.t=='fx'){if(m.b)banner(m.b[0],m.b[1]);if(m.s)snd(m.s);return}
  if(m.t=='state'){
    const pre=PRE,post=POST;PRE=[];POST=[];
    for(const a of pre)await runAnim(a);
    applySnap(m.s);LAST={me:m.s.me,n:m.s.n};
    post.forEach(a=>{const i=(a.i-LAST.me+LAST.n)%LAST.n;animDraw(i,a.cv||Array.from({length:a.n},()=>({r:0,s:'',id:'x'})))});
  }
}
function applySnap(s){
  const n=s.n,dm=()=>({r:0,s:'',id:'z'+(uid++)});
  P=[];for(let k=0;k<n;k++){const q=s.pl[(s.me+k)%n];P.push({n:q.n,bot:q.bot,h:k?Array.from({length:q.h},dm):q.h,u:q.u,d:Array.from({length:q.d},dm)})}
  const hid=Math.max(0,s.pile-s.top.length),rel=x=>x==null?null:(x-s.me+n)%n;
  G={diff:s.diff,deck:Array.from({length:s.deck},dm),pile:[...Array.from({length:hid},()=>({r:0,s:'♠',id:'z'+(uid++)})),...s.top],dir:s.dir,jk:s.jk,over:s.over,loser:rel(s.loser),cur:rel(s.cur),resp:s.resp?{other:1}:null,log:s.log};
  sel=sel.filter(id=>{const p=P[0],c=p[phase(p)].find(x=>x.id==id);return c&&(G.cur==0||(lzOK()&&c.r==tp().r))});
  render();
}
(function(){let r='';try{r=localStorage.getItem('cdc_room')||''}catch(e){}if(r&&TOK){ROOM=r;tryRe()}else home()})();

</script></body></html>
